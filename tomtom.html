<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trafic TomTom – Dernières données</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .legend {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(255,255,255,0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 13px;
      z-index: 1;
    }
    .legend h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
    .legend-gradient {
      height: 12px;
      width: 180px;
      border-radius: 4px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #c0392b, #e67e22, #27ae60);
    }
    .legend-labels { display: flex; justify-content: space-between; color: #666; font-size: 11px; }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.95);
      padding: 24px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 2;
      font-size: 15px;
    }
    .loading.hidden { display: none; }
    .error { color: #c0392b; margin-top: 8px; }
    .meta { margin-top: 6px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="loading" class="loading">Chargement des données…</div>
  <div class="legend" id="legend" style="display: none;">
    <h3>Vitesse (km/h) — TomTom Flow</h3>
    <div class="legend-gradient"></div>
    <div class="legend-labels">
      <span>0</span>
      <span>120</span>
    </div>
    <p class="meta" id="meta"></p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const DATA_URL = params.get('file') ? ('tomtom/' + params.get('file')) : 'tomtom/flow-latest.json';
    const MIN_SPEED = 0;
    const MAX_SPEED = 120;

    function speedToColor(speed) {
      if (speed == null || isNaN(speed)) return '#95a5a6';
      const t = Math.max(0, Math.min(1, (speed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)));
      const red = [0xc0, 0x39, 0x2b];
      const orange = [0xe6, 0x7e, 0x22];
      const green = [0x27, 0xae, 0x60];
      let r, g, b;
      if (t <= 0.5) {
        const u = t / 0.5;
        r = Math.round(red[0] + (orange[0] - red[0]) * u);
        g = Math.round(red[1] + (orange[1] - red[1]) * u);
        b = Math.round(red[2] + (orange[2] - red[2]) * u);
      } else {
        const u = (t - 0.5) / 0.5;
        r = Math.round(orange[0] + (green[0] - orange[0]) * u);
        g = Math.round(orange[1] + (green[1] - orange[1]) * u);
        b = Math.round(orange[2] + (green[2] - orange[2]) * u);
      }
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function buildGeoJSON(data) {
      const segments = data.segments || [];
      const valid = segments.filter(s => s.currentSpeed != null && !s.error);
      let minS = Infinity, maxS = -Infinity;
      valid.forEach(s => {
        if (s.currentSpeed < minS) minS = s.currentSpeed;
        if (s.currentSpeed > maxS) maxS = s.currentSpeed;
      });
      if (minS === Infinity) minS = 0;
      if (maxS === -Infinity) maxS = MAX_SPEED;

      const features = valid.map((s, i) => ({
        type: 'Feature',
        id: i,
        properties: {
          speed: s.currentSpeed,
          freeFlowSpeed: s.freeFlowSpeed,
          confidence: s.confidence,
          frc: s.frc,
          roadClosure: s.roadClosure,
          color: speedToColor(s.currentSpeed),
        },
        geometry: {
          type: 'Point',
          coordinates: [s.point.lon, s.point.lat],
        },
      }));

      return {
        type: 'FeatureCollection',
        features,
        bbox: data.bbox,
        fetchedAt: data.fetchedAt,
        stats: { minSpeed: minS, maxSpeed: maxS },
      };
    }

    function initMap(geojson) {
      const bbox = geojson.bbox;
      const bounds = bbox
        ? [[bbox.lonMin, bbox.latMin], [bbox.lonMax, bbox.latMax]]
        : null;

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            osm: {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: '© OpenStreetMap',
            },
            flow: {
              type: 'geojson',
              data: { type: 'FeatureCollection', features: geojson.features },
            },
          },
          layers: [
            { id: 'osm', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 19 },
            {
              id: 'flow-circles',
              type: 'circle',
              source: 'flow',
              paint: {
                'circle-radius': 6,
                'circle-color': ['get', 'color'],
                'circle-stroke-width': 1,
                'circle-stroke-color': '#fff',
              },
            },
          ],
        },
        center: bbox
          ? [(bbox.lonMin + bbox.lonMax) / 2, (bbox.latMin + bbox.latMax) / 2]
          : [6.125, 46.175],
        zoom: 11,
      });

      if (bounds) {
        map.fitBounds(bounds, { padding: 40, maxZoom: 15 });
      }

      const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false });
      map.on('click', 'flow-circles', (e) => {
        const p = e.features[0].properties;
        let html = '<strong>' + (p.speed != null ? p.speed + ' km/h' : '—') + '</strong>';
        if (p.freeFlowSpeed != null) html += '<br>Free-flow : ' + p.freeFlowSpeed + ' km/h';
        if (p.frc) html += '<br>Catégorie : ' + p.frc;
        if (p.roadClosure) html += '<br><span style="color:#c0392b">Route fermée</span>';
        popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
      });
      map.on('mouseenter', 'flow-circles', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'flow-circles', () => map.getCanvas().style.cursor = '');

      document.getElementById('legend').style.display = 'block';
      const meta = document.getElementById('meta');
      meta.textContent = geojson.fetchedAt
        ? 'Données : ' + new Date(geojson.fetchedAt).toLocaleString('fr-CH') + ' — ' + geojson.features.length + ' segments'
        : geojson.features.length + ' segments';
      document.getElementById('loading').classList.add('hidden');
    }

    fetch(DATA_URL)
      .then((r) => {
        if (!r.ok) throw new Error(DATA_URL + ' introuvable (HTTP ' + r.status + '). Lancez la page depuis un serveur HTTP (racine du projet).');
        return r.json();
      })
      .then((data) => {
        const geojson = buildGeoJSON(data);
        if (!geojson.features.length) throw new Error('Aucun segment avec vitesse dans le JSON.');
        initMap(geojson);
      })
      .catch((err) => {
        document.getElementById('loading').innerHTML = 'Erreur <span class="error">' + (err.message || err) + '</span>';
      });
  </script>
</body>
</html>
